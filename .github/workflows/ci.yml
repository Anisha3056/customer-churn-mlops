name: Customer Churn CI

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5

      with:
        python-version: "3.11"


    - name: Install backend dependencies

      run: |

        pip install -r requirements.txt


    - name: Backend import test

      run: |

        python -c "import fastapi, pandas, sklearn"



    - name: Setup Node

      uses: actions/setup-node@v4

      with:
        node-version: 20


    - name: Install frontend dependencies

      run: |

        cd frontend

        npm install


    - name: Build frontend

      run: |

        cd frontend

        npm run build